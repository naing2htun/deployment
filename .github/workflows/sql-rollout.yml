name: Bytebase rollout SQL migrations

on:
  push:
    branches:
      - main
    paths:
      - "*/overlays/**/migrations/*.up.sql"
      - ".github/workflows/sql-rollout.yml" # to allow workflow updates

jobs:
  rollout:
    uses: naing2htun/actions/.github/workflows/sql-rollout.yml@main
    with:
      bytebase-url: ${{ vars.BYTEBASE_URL_NONPROD }}
      bytebase-service-account: ${{ vars.BYTEBASE_SERVICE_ACCOUNT_NONPROD }}
    secrets:
      bytebase-service-account-secret: ${{ secrets.BYTEBASE_SERVICE_ACCOUNT_SECRET_NONPROD }}
      access-token: ${{ secrets.GITHUB_TOKEN }}